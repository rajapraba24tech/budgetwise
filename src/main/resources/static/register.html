<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart BudgetWise Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 440px;
            background: rgba(255,255,255,0.97);
        }
        .card-header {
            background: linear-gradient(135deg,#667eea,#764ba2);
            border-radius: 20px 20px 0 0 !important;
            padding: 30px;
            text-align: center;
        }
        .card-header h3 { color:white; font-weight:700; margin:0; }
        .card-header p  { color:rgba(255,255,255,0.85); margin:5px 0 0; font-size:14px; }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .btn-register {
            background: linear-gradient(135deg,#667eea,#764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-register:hover { opacity: 0.9; color: white; }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
        }
        .input-group .form-control {
            border-radius: 0 10px 10px 0;
            border-left: none;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            color: #aaa;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9ecef;
        }
        .btn-google {
            width: 100%;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            color: #444;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-google:hover { border-color:#667eea; background:#f8f9ff; }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <i class="fas fa-user-plus fa-2x text-white mb-2"></i>
        <h3>Create Account</h3>
        <p>Start your smart budgeting journey</p>
    </div>
    <div class="card-body p-4">

        <div id="alertBox" class="alert d-none mb-3"></div>

        <!-- ── Google Register ── -->
        <button class="btn-google" onclick="googleRegister()" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign up with Google
        </button>

        <div class="divider">or register with email</div>

        <!-- ── Full Name ── -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>
        </div>

        <!-- ── Email ── -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>
        </div>

        <!-- ── Password ── -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Create password (min 4 chars)">
                <button class="btn btn-outline-secondary" type="button"
                    style="border-radius:0 10px 10px 0;border:2px solid #e9ecef;border-left:none"
                    onclick="togglePwd()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <!-- ── Confirm Password ── -->
        <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password"
                    onkeypress="if(event.key==='Enter') register()">
            </div>
        </div>

        <!-- ── Register Button ── -->
        <button class="btn-register mb-3" onclick="register()" id="registerBtn">
            <span id="registerBtnText"><i class="fas fa-user-plus me-2"></i>Create Account</span>
            <span class="loading-spinner" id="registerSpinner"></span>
        </button>

        <div class="text-center">
            <span class="text-muted">Already have an account? </span>
            <a href="login.html" class="text-decoration-none fw-semibold" style="color:#667eea">Login</a>
        </div>

    </div>
</div>

<script>
const CLIENT_ID = '654579357744-mjkkbsd3qa1fgep1o5p6l8fl9s8cnmns.apps.googleusercontent.com';

// ── Email Register ──────────────────────────────────────
async function register() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const confirm  = document.getElementById('confirmPassword').value.trim();

    if (!name || !email || !password || !confirm) {
        showAlert('Please fill all fields!', 'danger'); return;
    }
    if (password !== confirm) {
        showAlert('Passwords do not match!', 'danger'); return;
    }
    if (password.length < 4) {
        showAlert('Password must be at least 4 characters!', 'danger'); return;
    }

    // Show loading
    setLoading(true);

    try {
        const response = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, monthlyIncome: 0 })
        });

        if (response.ok) {
            showAlert('✅ Account created! Redirecting to login...', 'success');
            setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
            const msg = await response.text();
            showAlert(msg || 'Registration failed!', 'danger');
            setLoading(false);
        }
    } catch(err) {
        showAlert('Server not running! Start Eclipse first.', 'danger');
        setLoading(false);
    }
}

// ── Google Register ─────────────────────────────────────
function googleRegister() {
    if (typeof google === 'undefined') {
        showAlert('Google login loading... Try again in a second!', 'warning');
        return;
    }
    google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleGoogleRegister
    });
    google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed()) {
            showAlert('Google popup blocked! Allow popups and try again.', 'warning');
        }
    });
}

async function handleGoogleRegister(response) {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const name    = payload.name;
    const email   = payload.email;
    const gPass   = 'GOOGLE_AUTH_' + payload.sub;

    showAlert('⏳ Creating account with Google...', 'info');

    try {
        // First try to register
        const regRes = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password: gPass, monthlyIncome: 0 })
        });

        if (regRes.ok) {
            showAlert('✅ Account created with Google! Redirecting to login...', 'success');
            setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
            // Already registered → go to login
            showAlert('✅ Account already exists! Redirecting to login...', 'warning');
            setTimeout(() => window.location.href = 'login.html', 1500);
        }
    } catch(err) {
        showAlert('Server not running! Start Eclipse first.', 'danger');
    }
}

// ── Helper Functions ────────────────────────────────────
function togglePwd() {
    const pwd  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'fas fa-eye';
    }
}

function setLoading(loading) {
    const btn     = document.getElementById('registerBtn');
    const text    = document.getElementById('registerBtnText');
    const spinner = document.getElementById('registerSpinner');
    btn.disabled         = loading;
    text.style.display   = loading ? 'none'  : 'inline';
    spinner.style.display= loading ? 'inline-block' : 'none';
}

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className   = `alert alert-${type}`;
    box.textContent = msg;
}
</script>
</body>
</html>
